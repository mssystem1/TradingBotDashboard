name: Paper worker

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/alerts.yml
      - scripts/check-markets.js
      - lib/market.js

permissions: {}

concurrency:
  group: paper-alerts
  cancel-in-progress: false

jobs:
  prices:
    name: Check Hyperliquid prices
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Read current public quotes
        run: node scripts/check-markets.js

  check:
    name: Check paper alerts
    if: vars.ALERT_JOB_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      APP_ORIGIN: ${{ vars.ALERT_APP_ORIGIN }}
      JOB_KEY: ${{ secrets.ALERT_JOB_SECRET }}
    steps:
      - name: Check paper alerts
        shell: bash
        run: |
          if [[ ! "$APP_ORIGIN" =~ ^https://[a-zA-Z0-9.-]+$ || ${#JOB_KEY} -lt 32 ]]; then
            echo "Set the Vercel HTTPS origin and alert job secret."
            exit 1
          fi
          curl --proto '=https' --max-time 35 --fail --silent --show-error \
            --request POST --header "Authorization: Bearer $JOB_KEY" "$APP_ORIGIN/api/alerts"
